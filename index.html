<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap"
      rel="stylesheet"
    />
    <title>NVC Noticias - Contacto</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <img src="img/LogoNVC.jpg" alt="Logo NVC Noticias" class="logo" />
    </header>

    <main id="Cont-Principal">
      <a
        href="https://www.facebook.com/nvc.noticias"
        target="_blank"
        rel="noopener noreferrer"
        class="btn"
      >
        <img src="img/facebook.png" alt="Logo Facebook" class="RedSocial" />
        <span>Síguenos en Facebook</span>
      </a>

      <a
        href="https://www.instagram.com/nvcnoticias/"
        target="_blank"
        rel="noopener noreferrer"
        class="btn"
      >
        <img src="img/instagram.png" alt="Logo Instagram" class="RedSocial" />
        <span>Síguenos en Instagram</span>
      </a>

      <a
        href="https://x.com/NOTICIASNVC"
        target="_blank"
        rel="noopener noreferrer"
        class="btn"
      >
        <img src="img/twitter.png" alt="Logo X" class="RedSocial" />
        <span>Síguenos en X</span>
      </a>
      <a
        href="https://www.youtube.com/@nvcnoticias2446"
        target="_blank"
        rel="noopener noreferrer"
        class="btn"
      >
        <img src="img/youtube.png" alt="Logo YouTube" class="RedSocial" />
        <span>Síguenos en YouTube</span>
      </a>

      <a
        href="https://nvcnoticias.com/"
        target="_blank"
        rel="noopener noreferrer"
        class="btn"
      >
        <img
          src="img/LogoLinkNVC.jpg"
          alt="Logo NVC Noticias"
          class="RedSocial"
        />
        <span>Mantente Informado</span>
      </a>
      <a
        href="https://wa.me/523112504066"
        target="_blank"
        rel="noopener noreferrer"
        class="btn"
      >
        <img src="img/whatsapp.png" alt="Logo WhatsApp" class="RedSocial" />
        <span>Contáctanos por WhatsApp</span>
      </a>
    </main>
  </body>
</html>
